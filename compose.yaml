services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: spendtrace
      POSTGRES_USER: spendtrace
      POSTGRES_PASSWORD: spendtrace-local-only
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - spendtrace-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spendtrace -d spendtrace"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  spendtrace-postgres:
